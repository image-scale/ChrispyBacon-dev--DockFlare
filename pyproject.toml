[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockflare"
version = "1.0.0"
description = "Automate Cloudflare Tunnels with Docker Labels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flask-wtf>=1.2.0",
    "flask-caching>=2.0.0",
    "flask-limiter>=3.0.0",
    "authlib>=1.0.0",
    "requests>=2.28.0",
    "docker>=6.0.0",
    "redis>=4.5.0",
    "cryptography>=40.0.0",
    "python-dotenv>=1.0.0",
    "waitress>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
